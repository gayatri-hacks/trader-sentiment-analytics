name: Reporting tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/reporting.py
      - run: python -m unittest discover -s tests -v
      - run: |
          python scripts/reporting.py --out /tmp/reports-one
          python scripts/reporting.py --out /tmp/reports-two
          diff -ru /tmp/reports-one /tmp/reports-two
